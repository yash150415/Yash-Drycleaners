<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Contact Sheet</title>
<style>
  body{background:#f6f4ee;font-family:Arial,sans-serif;margin:0;padding:20px}
  h1{color:#0d1b24;font-size:18px}
  .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  figure{margin:0;background:#fff;border:1px solid #e3e0d6;border-radius:12px;overflow:hidden}
  img{width:100%;height:190px;object-fit:contain;background:#fff;display:block}
  figcaption{padding:8px 10px;font-size:13px;color:#1d2b35;font-weight:bold}
  figcaption span{display:block;font-weight:normal;color:#5d6b75;font-size:11px;margin-top:2px}
</style>
</head>
<body>
<h1>Root images/ folder — 15 photos</h1>
<div class="g">
  <figure><img src="images/before.png"><figcaption>before.png<span>stain proof?</span></figcaption></figure>
  <figure><img src="images/Blanket.jpg"><figcaption>Blanket.jpg</figcaption></figure>
  <figure><img src="images/carpet.jpg"><figcaption>carpet.jpg</figcaption></figure>
  <figure><img src="images/curtain.jpg"><figcaption>curtain.jpg</figcaption></figure>
  <figure><img src="images/shirt cleaning.png"><figcaption>shirt cleaning.png</figcaption></figure>
  <figure><img src="images/Dry_Cleaning.jpg"><figcaption>Dry_Cleaning.jpg</figcaption></figure>
  <figure><img src="images/logo.png"><figcaption>logo.png<span>logo — not a photo?</span></figcaption></figure>
  <figure><img src="images/owner.jpg"><figcaption>owner.jpg<span>owner avatar</span></figcaption></figure>
  <figure><img src="images/saree-care.jpg"><figcaption>saree-care.jpg</figcaption></figure>
  <figure><img src="images/shop-front.jpg"><figcaption>shop-front.jpg</figcaption></figure>
  <figure><img src="images/steam-press.jpg"><figcaption>steam-press.jpg</figcaption></figure>
  <figure><img src="images/Suit.jpg"><figcaption>Suit.jpg</figcaption></figure>
  <figure><img src="images/Trouser cleaning.webp"><figcaption>Trouser cleaning.webp<span>webp</span></figcaption></figure>
  <figure><img src="images/Wash & Fold.webp"><figcaption>Wash &amp; Fold.webp<span>webp</span></figcaption></figure>
</div>
</body>
</html>
